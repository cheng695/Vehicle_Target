# 底盘参数唯一配置源。修改后由 tools/generate_chassis_config.py 生成 C++ 头文件。
# 修改配置后需重新编译并烧录；车轮序号必须在布局、PID 和电机 ID 中保持一致。

wheel_count: 4 # 车轮数量；当前正、逆运动学算法固定支持四轮。

geometry:
  chassis_radius_m: 0.3 # 底盘中心到车轮安装点的等效距离，单位：米；FK 与 IK 必须一致。
  wheel_radius_m: 0.07   # 车轮半径，单位：米；FK 与 IK 必须一致。

# 轮序须与 motor.receive_ids、wheel_pid 保持一致。角度单位：弧度。
# 用于调整运动正方向与旋转方向
wheel_layout:
  azimuth_rad: [-0.7853981634, -2.3561944902, 0.7853981634, 2.3561944902]   # 各轮滚子允许自由滚动方向相对底盘 X 轴的角度。
  direction_rad: [0.7853981634, -0.7853981634, 2.3561944902, -2.3561944902] # 底盘中心指向各轮安装点的方向角。

# 每个车轮一组 PID：Kp、Ki、Kd、输出限幅、积分限幅、积分分离阈值。
wheel_pid:
  - [700, 0.5, 0, 16384, 2500, 100] # 1 号车轮 PID 参数。
  - [700, 0.5, 0, 16384, 2500, 100] # 2 号车轮 PID 参数。
  - [700, 0.5, 0, 16384, 2500, 100] # 3 号车轮 PID 参数。
  - [700, 0.5, 0, 16384, 2500, 150] # 4 号车轮 PID 参数。

# X、Y 方向斜坡规划。
translation_ramp:
  increase_per_cycle: 0.015 # 斜坡规划增加量；增大可使加速更快。
  decrease_per_cycle: 0.015 # 斜坡规划减少量；增大可使减速更快。

control_period_s: 0.001 # 控制周期，单位：秒；必须与 ControlTask 的实际调用周期相符。

remote:
  deadzone: 0.05            # 遥控输入死区；绝对值小于此值时按零处理，输入范围为 [-1, 1]。
  linear_gain_mps: 4.5      # 遥控平移速度增益，单位：米/秒；输入为 ±1 时对应的目标速度。
  rotation_gain_radps: 13 # 遥控旋转速度增益，单位：弧度/秒；输入为 ±1 时对应的目标角速度。

patrol:
  speed_mps: 1.3                     # 自动巡航直线速度，单位：米/秒；
  stop_linear_threshold_mps: 0.05    # 巡航端点停稳判定的平移速度阈值，单位：米/秒。
  stop_angular_threshold_radps: 0.05 # 巡航端点停稳判定的角速度阈值，单位：弧度/秒。
  settle_cycles: 200                 # 端点连续满足停稳条件的周期数；当前周期下约为 200 ms。
  distance_m: 5                    # 自动巡航单程距离，单位：米。
  vehicle_turn_radius_m: 0.3        # 角速度换算为车轮等效线速度时使用的半径，可以理解成圆形车的半径，单位：米。
  max_wheel_speed_mps: 5.2           # 平移与旋转合成后的车轮线速度上限，单位：米/秒。

motor:
  init_can_id: 0x200                # 底盘 3508 电机组的 CAN 接收帧 ID。
  receive_ids: [1, 2, 3, 4]         # 各车轮电机 ID，顺序须与布局和 PID 数组一致。
  send_can_id: 0x200                # 底盘 3508 电机组的 CAN 控制帧 ID。
  reduction_ratio: 15.7647058823529 # GM3508 减速比，用于反馈单位换算。
  torque_constant_nm_per_a: 0.3     # 电机力矩常数，单位：牛·米/安培。
  feedback_current_max: 16384     # 电机反馈电流的原始量程参数。
  model_current_max_a: 20         # GM3508 电机模型最大电流参数，单位：安培。
  encoder_resolution: 8192        # 编码器分辨率，单位：编码器计数/圈。

# 给生成头文件和编辑器悬停提示使用的说明文本。
